site_name: c++ and bp docs
site_url: https://knutschbert.github.io/chiv2-tblcpp-mkdocs-clean/
repo_url: https://github.com/Knutschbert/chiv2-tblcpp-mkdocs-clean
edit_uri: blob/main/docs/


theme:
    name: 'material'
    features:
      # Render only the active navigation branch on each page. With ~6000 pages
      # and no explicit nav, Material otherwise inlines the full nav tree into
      # every page (~2.6 MB each → ~15 GB site, over the Pages 10 GB limit).
      - navigation.prune
      - navigation.indexes
    font:
      text: Volkov
    palette:

    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Extensions
markdown_extensions:
  - footnotes
  # - attr_list
  - pymdownx.arithmatex:
      generic: true
  # - pymdownx.superfences
  # - pymdownx.details
  # - pymdownx.magiclink
  - pymdownx.tasklist:
      custom_checkbox: true
  - def_list
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  - toc:
      permalink: true

hooks:
  - hooks/fix_links.py

plugins:
  - search
  - roamlinks 


extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid/dist/mermaid.min.js
